name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          emulator: false

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: |
          cd mobile
          npm ci --legacy-peer-deps

      - name: Debug - Check Expo Version
        run: |
          cd mobile
          npx expo --version
          npx expo-doctor

      - name: Prebuild Expo
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: Increase Gradle Memory
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> mobile/android/gradle.properties

      - name: Build Release APK
        run: |
          cd mobile
          npx expo run:android --variant release

      - name: Find APK
        run: |
          find mobile/android -name "*.apk" -type f
          APK_PATH=$(find mobile/android -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Upload APK Info
        run: |
          APK_SIZE=$(wc -c < "${{ env.APK_PATH }}")
          echo "APK Size: $((APK_SIZE / 1024 / 1024)) MB"
          echo "Built at: $(date)"